[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Autonomous multi-agent research pipeline with search, scraping, synthesis, and critique"
readme = "README.md"
authors = [
    { name = "rishavvrajj", email = "rishav5raj3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=4.5.2",
    "tavily-python>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
]

[project.scripts]
multi-agent-system = "multi_agent_system:main"
multi-agent-system-ui = "multi_agent_system.ui:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
